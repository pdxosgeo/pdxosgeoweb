name: Deploy Astro site

# Manual only for now: switch Settings → Pages → Source to "GitHub Actions", then
# uncomment the push trigger (and the schedule, so "Next meeting" rolls over after
# each meetup) when ready to make this the live site.
on:
  workflow_dispatch:
  # push:
  #   branches: [gh-pages]
  # schedule:
  #   - cron: '0 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
